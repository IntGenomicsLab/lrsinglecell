# Fallback for running MultiQC on this config by hand. The pipeline overrides it with a
# comment linking to the version that ran (the release tag, or the dev branch for a dev
# version), built by multiqcReportComment() in
# subworkflows/local/utils_nfcore_lrsinglecell_pipeline. This line has no version in it,
# so `nf-core pipelines bump-version` leaves it alone.
report_comment: >
  This report has been generated by the <a href="https://github.com/IntGenomicsLab/lrsinglecell" target="_blank">IntGenomicsLab/lrsinglecell</a> analysis pipeline.
report_section_order:
  "IntGenomicsLab-lrsinglecell-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "IntGenomicsLab-lrsinglecell-summary":
    order: -1002
  fastqc_postextract_fastqc_per_base_sequence_quality: remove
  fastqc_postextract_fastqc_per_sequence_quality_scores: remove
  fastqc_postextract_fastqc_per_base_sequence_content: remove
  fastqc_postextract_fastqc_per_sequence_gc_content: remove
  fastqc_postextract_fastqc_per_base_n_content: remove
  fastqc_postextract_fastqc_sequence_length_distribution: remove
  fastqc_postextract_fastqc_sequence_duplication_levels: remove
  fastqc_postextract_fastqc_overrepresented_sequences: remove
  fastqc_postextract_fastqc_adapter_content: remove
  fastqc_postextract_fastqc_status_checks: remove

export_plots: true

disable_version_detection: true
# parse files up to 2GB
log_filesize_limit: 2000000000

top_modules:
  - general_stats
  - custom_content
  - samtools
  - picard
  - nanostat
  - rseqc
  - fastqc:
      name: "FastQC (raw)"
      anchor: "fastqc"
      info: "This section of the report shows FastQC results of the raw data"
      path_filters:
        - "*raw*fastqc*"
  - fastqc:
      name: "FastQC (post trimmed)"
      anchor: "fastqc_posttrim"
      info: "This section of the report shows FastQC results of the trimmed data"
      path_filters:
        - "*trimmed*fastqc*"
  - fastqc:
      name: "FastQC (post extract)"
      anchor: "fastqc_postextract"
      info: "This section of the report shows FastQC results of the trimmed and umi extracted data"
      path_filters:
        - "*extracted*fastqc*"

custom_content:
  read_counts_section:
    parent_id: read_counts_section
    order: read_counts_module

  dedup_section:
    parent_id: dedup_section
    order:
      - umitools_dedup_summary_module
      - dna_dedup_summary_module

  seurat_section:
    parent_id: seurat_section
    order:
      - isoquant_transcript_seurat_stats_module
      - isoquant_gene_seurat_stats_module
      - oarfish_transcript_seurat_stats_module
      - lrkallisto_gene_seurat_stats_module
      - lrkallisto_transcript_seurat_stats_module

custom_data:
  read_counts_module:
    parent_id: read_counts_section
    parent_name: "Read Counts Section"
    parent_description: "Read counts of samples as they progress through the pipeline"
    section_name: "Read Counts"
    file_format: "csv"
    plot_type: "table"

  umitools_dedup_summary_module:
    parent_id: dedup_section
    parent_name: "Deduplication Section"
    parent_description: "Deduplication summary per sample: UMI-tools for the cDNA alignments (genome / transcriptome) and mark_dna_duplicates.py for the DNA alignments. cDNA deduplication runs per chromosome or transcript group, so its read counts are summed over all chunks of a sample."
    section_name: "UMI-tools Deduplication"
    file_format: "tsv"
    plot_type: "table"
    pconfig:
      id: "umitools_dedup_summary_table"
      title: "UMI-tools deduplication summary"
    headers:
      input_reads:
        title: "Input reads"
        description: "Reads entering umi_tools dedup, summed over all chunks"
        format: "{:,.0f}"
      output_reads:
        title: "Output reads"
        description: "Reads kept after deduplication, summed over all chunks"
        format: "{:,.0f}"
      duplicate_reads:
        title: "Duplicate reads"
        description: "Reads removed as UMI duplicates"
        format: "{:,.0f}"
      duplication_rate:
        title: "Duplication rate"
        description: "duplicate_reads / input_reads"
        min: 0
        max: 1
        format: "{:.4f}"
      n_dedup_runs:
        title: "Dedup runs"
        description: "Number of umi_tools dedup runs summed for this sample"
        format: "{:,.0f}"

  dna_dedup_summary_module:
    parent_id: dedup_section
    parent_name: "Deduplication Section"
    parent_description: "Deduplication summary per sample: UMI-tools for the cDNA alignments (genome / transcriptome) and mark_dna_duplicates.py for the DNA alignments. cDNA deduplication runs per chromosome or transcript group, so its read counts are summed over all chunks of a sample."
    section_name: "DNA Duplicate Marking"
    description: "Duplicate marking of the DNA alignments by mark_dna_duplicates.py, per sample, from its <code>*.dedup_summary.tsv</code>. On the exact-only contigs (chrM/MT by default) only the exact rules apply. The nuclear duplicate rate leaves those contigs out: in libraries with a high mitochondrial fraction it is the rate to read."
    file_format: "tsv"
    plot_type: "table"
    pconfig:
      id: "dna_dedup_summary_table"
      title: "DNA duplicate marking summary"
    headers:
      primary_reads:
        title: "Primary reads"
        description: "Primary alignments with a barcode tag examined for duplicates"
        format: "{:,.0f}"
      molecules:
        title: "Molecules"
        description: "Distinct molecules: one unflagged representative each"
        format: "{:,.0f}"
      duplicates:
        title: "Duplicates"
        description: "Primary alignments flagged as duplicates"
        format: "{:,.0f}"
      duplicate_rate:
        title: "Duplicate rate"
        description: "duplicates / primary_reads, over all contigs"
        min: 0
        max: 1
        scale: "OrRd"
        format: "{:.1%}"
      nuclear_duplicate_rate:
        title: "Nuclear duplicate rate"
        description: "Duplicate rate without the exact-only (mitochondrial) contigs"
        min: 0
        max: 1
        scale: "OrRd"
        format: "{:.1%}"
      exact_only_contigs_primary_reads:
        title: "chrM/MT primary reads"
        description: "Primary alignments on the exact-only contigs (chrM/MT by default)"
        format: "{:,.0f}"
      exact_only_contigs_duplicates:
        title: "chrM/MT duplicates"
        description: "Duplicates on the exact-only contigs"
        format: "{:,.0f}"
      dup_by_key_5prime_strand:
        title: "Dup: 5' key"
        description: "Duplicates by barcode, 5' unclipped coordinate and strand (Picard's key)"
        format: "{:,.0f}"
        hidden: true
      dup_added_by_same_raw_read:
        title: "Dup: same raw read"
        description: "Duplicates added because flexiplex wrote the same raw read out twice"
        format: "{:,.0f}"
        hidden: true
      dup_added_by_5prime_jitter:
        title: "Dup: 5' jitter"
        description: "Duplicates added by 5' jitter tolerance between read-through reads"
        format: "{:,.0f}"
        hidden: true
      dup_added_by_aa_opposite_end:
        title: "Dup: A-A other end"
        description: "Duplicates added as A-A fragments read from the other end"
        format: "{:,.0f}"
        hidden: true
      no_barcode:
        title: "No barcode"
        description: "Primary alignments without the barcode tag, left unflagged"
        format: "{:,.0f}"
        hidden: true

  dna_dedup_general_stats_module:
    plot_type: "generalstats"
    file_format: "tsv"
    headers:
      nuclear_duplicate_rate:
        title: "DNA nuclear dups"
        description: "DNA duplicate rate without the exact-only (mitochondrial) contigs, from mark_dna_duplicates.py"
        min: 0
        max: 1
        scale: "OrRd"
        format: "{:.1%}"
      duplicate_rate:
        title: "DNA dups"
        description: "DNA duplicate rate over all contigs, from mark_dna_duplicates.py"
        min: 0
        max: 1
        scale: "OrRd"
        format: "{:.1%}"
        hidden: true

  gene_tag_summary_module:
    plot_type: "generalstats"
    file_format: "tsv"
    headers:
      reads:
        title: "Gene-tagged alignments"
        description: "Alignments tagged by tag_genes.py (primary, secondary and supplementary)"
        format: "{:,.0f}"
        hidden: true
      gs_none_reads:
        title: "Alignments without gene"
        description: "Alignments overlapping no gene body in the GTF (GS=none)"
        format: "{:,.0f}"
        hidden: true
      gs_none_fraction:
        title: "% reads without gene"
        description: "Share of genome alignments that overlap no gene body in the GTF (GS=none), and are deduplicated positionally rather than per gene. A jump between runs suggests a GTF that does not match the reference"
        min: 0
        max: 1
        scale: "OrRd"
        format: "{:.1%}"

  isoquant_gene_seurat_stats_module:
    parent_id: seurat_section
    parent_name: "Seurat Section"
    parent_description: "Preliminary expression analysis summary completed with Seurat using IsoQuant generated matrices. Note that these numbers are generated without any filtering done on the dataset"
    section_name: "IsoQuant Gene Seurat Stats"
    file_format: "tsv"
    plot_type: "table"

  isoquant_transcript_seurat_stats_module:
    parent_id: seurat_section
    parent_name: "Seurat Section"
    parent_description: "Preliminary expression analysis summary completed with Seurat using IsoQuant generated matrices. Note that these numbers are generated without any filtering done on the dataset"
    section_name: "IsoQuant Transcript Seurat Stats"
    file_format: "tsv"
    plot_type: "table"

  oarfish_transcript_seurat_stats_module:
    parent_id: seurat_section
    parent_name: "Seurat Section"
    parent_description: "Preliminary expression analysis summary completed with Seurat using OARFISH generated matrices. Note that these numbers are generated without any filtering done on the dataset"
    section_name: "OARFISH Transcript Seurat Stats"
    file_format: "tsv"
    plot_type: "table"

  lrkallisto_gene_seurat_stats_module:
    parent_id: seurat_section
    parent_name: "Seurat Section"
    parent_description: "Preliminary expression analysis summary completed with Seurat using lr-kallisto generated matrices. Note that these numbers are generated without any filtering done on the dataset"
    section_name: "lr-kallisto Gene Seurat Stats"
    file_format: "tsv"
    plot_type: "table"

  lrkallisto_transcript_seurat_stats_module:
    parent_id: seurat_section
    parent_name: "Seurat Section"
    parent_description: "Preliminary expression analysis summary completed with Seurat using lr-kallisto generated matrices. Note that these numbers are generated without any filtering done on the dataset"
    section_name: "lr-kallisto Transcript Seurat Stats"
    file_format: "tsv"
    plot_type: "table"

sp:
  isoquant_gene_seurat_stats_module:
    fn: "isoquant_gene.tsv"
  isoquant_transcript_seurat_stats_module:
    fn: "isoquant_transcript.tsv"
  oarfish_transcript_seurat_stats_module:
    fn: "oarfish_transcript.tsv"
  lrkallisto_gene_seurat_stats_module:
    fn: "lrkallisto_gene.tsv"
  lrkallisto_transcript_seurat_stats_module:
    fn: "lrkallisto_transcript.tsv"
  read_counts_module:
    fn: "read_counts.csv"
  umitools_dedup_summary_module:
    fn: "*.umi_dedup_summary.tsv"
  dna_dedup_summary_module:
    fn: "dna_dedup_summary.tsv"
  dna_dedup_general_stats_module:
    fn: "dna_dedup_general_stats.tsv"
  gene_tag_summary_module:
    fn: "*.gene_tag_summary.tsv"
