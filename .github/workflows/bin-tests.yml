name: Unit-test bin scripts
# nf-test only collects *.nf.test, so the stdlib unittest suites under tests/bin run
# here, in the container of the module that calls the script.
on:
  pull_request:
    paths:
      - "bin/mark_dna_duplicates.py"
      - "bin/group_transcripts.sh"
      - "bin/split_bam.py"
      - "bin/tag_genes.py"
      - "bin/correct_barcodes.py"
      - "bin/pre_extract_barcodes.py"
      - "bin/drop_barcode.py"
      - "tests/bin/**"
      - ".github/workflows/bin-tests.yml"
  workflow_dispatch: null

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # same image as modules/local/mark_duplicates_dna, modules/local/split_bam and
  # modules/local/correct_barcodes
  IMAGE: quay.io/biocontainers/mulled-v2-bb96c7354781ab52d8e69ccff89587598dc87fea:ad24cd6a9acfe3ff51beb4c454076e18e778f7c0-0
  # same image as modules/local/group_transcripts
  UBUNTU_IMAGE: quay.io/nf-core/ubuntu:20.04

jobs:
  mark-dna-duplicates:
    name: mark_dna_duplicates.py
    runs-on: ubuntu-latest
    steps:
      # checked out on the runner: the biocontainers image is busybox-based and has no
      # libstdc++, so JavaScript actions cannot run inside it as a job container
      - name: Check out pipeline code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Run unit tests
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" \
            python -m unittest -v tests/bin/test_mark_dna_duplicates.py

  split-bam:
    name: split_bam.py
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Run unit tests
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" \
            python -m unittest -v tests/bin/test_split_bam.py

  group-transcripts:
    name: group_transcripts.sh
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # The test runs on the runner's python and calls the script through a wrapper, so
      # the script itself runs under the module image's bash and awk (mawk)
      - name: Run unit tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          export GROUP_TRANSCRIPTS_WRAPPER="docker run --rm -v $GITHUB_WORKSPACE:$GITHUB_WORKSPACE -v $TMPDIR:$TMPDIR $UBUNTU_IMAGE"
          python3 -m unittest -v tests/bin/test_group_transcripts.py

      - name: Run unit tests with the runner's awk
        run: python3 -m unittest -v tests/bin/test_group_transcripts.py

  tag-genes:
    name: tag_genes.py
    runs-on: ubuntu-latest
    env:
      # same image as modules/local/tag_genes
      IMAGE: quay.io/biocontainers/pysam:0.19.1--py310hff46b53_1
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Run unit tests
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" \
            python -m unittest -v tests/bin/test_tag_genes.py

  correct-barcodes:
    name: correct_barcodes.py
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Run unit tests
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" \
            python -m unittest -v tests/bin/test_correct_barcodes.py

  pre-extract-barcodes:
    name: pre_extract_barcodes.py
    runs-on: ubuntu-latest
    env:
      # same image as modules/local/preextract_fastq
      IMAGE: quay.io/biocontainers/mulled-v2-497e12343495a3e0f3b3459542cc8ad37575d9fa:483e027ac6835fcb80b9cfef4de8c89b67343941-0
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Run unit tests
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" \
            python -m unittest -v tests/bin/test_pre_extract_barcodes.py

  drop-barcode:
    name: drop_barcode.py
    runs-on: ubuntu-latest
    env:
      # same image as modules/local/drop_barcode
      IMAGE: quay.io/biocontainers/python:3.10.4
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Run unit tests
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" \
            python -m unittest -v tests/bin/test_drop_barcode.py
